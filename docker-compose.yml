# Qwen3 Instruct 微调 GGUF；Docker 为 CPU 备选，macOS 推荐原生 Ollama。
# 用法：
#   1. 把 Colab 训练导出的 .gguf 文件放到 ./models/ 目录
#   2. ./deploy.sh        （自动创建模型并验证）
#   3. ./deploy.sh docker
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-hrp-qa
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./models:/gguf:ro
      - ./Modelfile.generated:/Modelfile:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  ollama-data:
